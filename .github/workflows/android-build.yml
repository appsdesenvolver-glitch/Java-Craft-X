name: JAVA CRAFT X — Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      JCX_KEYSTORE_PASSWORD: ${{ secrets.JCX_KEYSTORE_PASSWORD }}
      JCX_KEY_ALIAS: ${{ secrets.JCX_KEY_ALIAS }}
    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Runtime Java 8 ARM (Minecraft até 1.16.5). Java 17/21/25 são baixados
      # pelo próprio app na primeira vez que uma versão mais nova é iniciada.
      - name: Baixar JRE 8 (Android)
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Preparar chave de assinatura (opcional)
        env:
          JCX_KEYSTORE_BASE64: ${{ secrets.JCX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JCX_KEYSTORE_BASE64" ]; then
            echo "$JCX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jcx.jks"
            echo "JCX_KEYSTORE_FILE=$RUNNER_TEMP/jcx.jks" >> "$GITHUB_ENV"
            echo "Assinando release com a chave JAVA CRAFT X"
          else
            echo "Sem segredo de keystore: release será assinado com a chave de debug"
          fi

      - name: Scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Release APK
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/JavaCraftX-release.apk

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/JavaCraftX-debug.apk

      - name: Checksums
        run: |
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -la

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JavaCraftX-APKs
          path: out/*

      - name: Publicar Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JAVA CRAFT X — build ${{ github.run_number }}
          body: |
            APKs gerados automaticamente pelo GitHub Actions (commit ${{ github.sha }}).
            - **JavaCraftX-release.apk** — instale este.
            - **JavaCraftX-debug.apk** — versão de depuração (instala ao lado, pacote .debug).
          files: |
            out/JavaCraftX-release.apk
            out/JavaCraftX-debug.apk
            out/SHA256SUMS.txt
